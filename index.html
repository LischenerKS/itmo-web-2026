<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1> Lischener Kirill P3214 Variant 501946</h1>
    </header>


    <main class="main-container">
        <div class="workspace">
            <canvas id="graph" width="300" height="300" style="border: 1px solid black;"></canvas>

            <form id="point-form">
                <div>
                    <label for="x-input">X [-5;5]:</label>
                    <input type="text" id="x-input" name="x" pattern="-?([0-4](\.\d+)?|5)" required>
                </div>

                <div>
                    <label for="y-input">Y [-5;5]:</label>
                    <input type="text" id="y-input" name="y" pattern="-?([0-4](\.\d+)?|5)" required>
                </div>

                <div>
                    <label>R:</label>
                    <div class="radio-buttons">
                        <div class="radio-option">
                            <input type="radio" id="r1" name="r" value="1" required>
                            <label for="r1">1</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="r2" name="r" value="2">
                            <label for="r2">2</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="r3" name="r" value="3">
                            <label for="r3">3</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="r4" name="r" value="4">
                            <label for="r4">4</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="r5" name="r" value="5">
                            <label for="r5">5</label>
                        </div>
                    </div>
                </div>

                <button type="submit">Check</button>
            </form>

        </div>


        <table id="results-table">
        <thead>
        <tr>
            <th>X</th>
            <th>Y</th>
            <th>R</th>
            <th>Результат</th>
            <th>Время</th>
        </tr>
        </thead>
        <tbody id="results-body">
        </tbody>
    </table>

    </main>
</body>
</html>
