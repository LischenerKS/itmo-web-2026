plugins {
    id 'application'
}

group = 'io.github.lischenerks'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation files('../lib/fastcgi-lib.jar')
}

application {
    mainClass = 'io.github.lischenerks.web.FastCgiServer'
    applicationDefaultJvmArgs = ["-DFCGI_PORT=${providers.gradleProperty('fcgiPort').getOrElse('9000')}"]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}
