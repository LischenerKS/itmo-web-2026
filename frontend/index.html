<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №2</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Lischener Kirill P3214 Variant 501946</h1>
    </header>

    <main class="main-container">
        <div class="workspace">
            <canvas id="graph" width="300" height="300" role="img"
                    aria-label="Координатная плоскость и область проверки">
                Область состоит из треугольника во второй четверти, четверти круга
                в третьей и квадрата в четвёртой, границы входят в область
            </canvas>

            <form id="point-form" action="/fcgi-bin/check" method="post">
                <fieldset>
                    <legend>X:</legend>
                    <div class="checkboxes">
                        <label class="checkbox-option"><input type="checkbox" name="x" value="-2" required>−2</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="-1.5">−1.5</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="-1">−1</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="-0.5">−0.5</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="0">0</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="0.5">0.5</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="1">1</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="1.5">1.5</label>
                        <label class="checkbox-option"><input type="checkbox" name="x" value="2">2</label>
                    </div>
                </fieldset>

                <div>
                    <label for="y-input">Y (−3; 3):</label>
                    <input type="text" id="y-input" name="y" inputmode="decimal"
                           pattern="-?0*[0-2](\.[0-9]+)?" required
                           aria-describedby="y-hint">
                    <small id="y-hint">Без границ, дробная часть через точку</small>
                </div>

                <div>
                    <label for="r-input">R:</label>
                    <select id="r-input" name="r" required>
                        <option value="" disabled selected>Выберите R</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <p id="form-error" role="alert" hidden></p>
                <button type="submit">Check</button>
            </form>
        </div>

        <button type="button" id="clear-history">Clear history</button>
        <section class="results" aria-label="Результаты проверки точек" tabindex="0">
            <table id="results-table">
                <thead>
                <tr>
                    <th scope="col">X</th>
                    <th scope="col">Y</th>
                    <th scope="col">R</th>
                    <th scope="col">Result</th>
                    <th scope="col">Time</th>
                    <th scope="col">Execution time, ms</th>
                </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
